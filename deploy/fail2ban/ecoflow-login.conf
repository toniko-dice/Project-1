# Грешен вход (401) или ограничен (429) към входа на Payload — от /vhod и
# от админа (същото API). Броят се само POST-овете към входа и забравената
# парола; разглеждането не се брои.
# fail2ban маха датата от реда преди проверката — остава „[]“, затова `[^\]]*`.
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "POST /api/users/(?:login|forgot-password)\S* HTTP/[\d.]+" (?:401|429) 
ignoreregex =
