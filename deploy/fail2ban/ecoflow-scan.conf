# Търсене на чужди системи и тайни файлове — nginx отговаря с 444 (затворена
# връзка) или 404 (deploy/nginx-ecoflow-app.conf).
# fail2ban маха датата от реда преди проверката — остава „[]“, затова `[^]]*`.
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "\S+ /(?:wp-|wordpress|phpmyadmin|pma|myadmin|xmlrpc\.php|cgi-bin|vendor/|\.env|\.git|\.svn|\.ht|config\.php)\S* HTTP/[\d.]+" (?:444|404) 
            ^<HOST> \S+ \S+ \[[^\]]*\] "\S+ \S+\.(?:php|asp|aspx|jsp|cgi|sql|bak)(?:\?\S*)? HTTP/[\d.]+" (?:444|404) 
ignoreregex =
