# nginx — общи настройки и зони на ограниченията (`task-otvaryane-https-ip.md`).
# На сървъра: /etc/nginx/conf.d/ecoflow-limits.conf (http контекст).
#
# Ключът е IP адресът на посетителя ($binary_remote_addr) — nginx е първият
# пред интернет, затова $remote_addr е истинският адрес (без Cloudflare).
# При Cloudflare (домейнът) → real_ip от CF-Connecting-IP, иначе всички
# посетители биха делили един лимит.

server_tokens off;
limit_req_status 429;

# Само POST се брои за входа и формите — отварянето на страницата не.
map $request_method $ef_post_ip {
    POST    $binary_remote_addr;
    default "";
}

# Числата — `task-fail2ban-bez-blokirane.md`: нормалното разглеждане и
# работата в админа никога не стигат лимит. Над него — 429, БЕЗ бан.
# Снимките, файловете и страниците — без ограничение (не са тук).

# Вход и забравена парола: 10 в минута от IP (+ burst 10).
limit_req_zone $ef_post_ip         zone=ef_login:10m rate=10r/m;
# Формите (оферта, контакти): 10 изпращания в минута (+ burst 5).
limit_req_zone $ef_post_ip         zone=ef_forms:10m rate=10r/m;
# Останалото /api/ (и админът): 600 в минута (+ burst 100).
limit_req_zone $binary_remote_addr zone=ef_api:10m   rate=600r/m;

# X-Robots-Tag (snippets/ecoflow-app.conf): `noindex` само за админа и
# /api/ — без /api/media/ (снимките). Регулярните изрази — по реда им.
map $uri $ef_robots {
    default          "";
    ~^/api/media/    "";
    ~^/admin         "noindex, nofollow";
    ~^/api/          "noindex, nofollow";
}
