# nginx — общото за всички входове към сайта (https, тунел).
# На сървъра: /etc/nginx/snippets/ecoflow-app.conf; включва се в `server`.
# (`task-otvaryane-https-ip.md`)

client_max_body_size 12m;

# Заглавия. БЕЗ HSTS — на IP адрес не се ползва; идва с домейна.
# `always` — и на грешките (401, 404, 429).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Предпазител срещу индексиране — същото като SITE_NOINDEX в .env; маха се
# при официалното пускане (и тук, и там).
add_header X-Robots-Tag "noindex, nofollow" always;
# ВНИМАНИЕ: `add_header` в `location` отменя всички горни. Затова по-долу в
# location-ите няма `add_header`.

# Сканиране за чужди системи и тайни файлове — затваря връзката без отговор
# (444). БЕЗ бан: ботовете и без това не получават нищо, а бан хваща и
# хора, които просто проверяват (така беше банат офисът на 13.10.2026).
location ~* ^/(wp-|wordpress|phpmyadmin|pma|myadmin|xmlrpc\.php|cgi-bin|vendor/|\.env|\.git|\.svn|\.ht|\.DS_Store|config\.php|server-status) {
    return 444;
}
location ~* \.(php|asp|aspx|jsp|cgi|sql|bak|old|orig|swp|ini|log|sh)$ {
    return 444;
}

# 429 — кратка страница на български (над лимита; без бан).
error_page 429 /429.html;
location = /429.html {
    internal;
    root /var/www/ecoflow-errors;
    default_type "text/html; charset=utf-8";
}

location = /api/users/login {
    limit_req zone=ef_login burst=10 nodelay;
    include /etc/nginx/snippets/ecoflow-proxy.conf;
}
location = /api/users/forgot-password {
    limit_req zone=ef_login burst=10 nodelay;
    include /etc/nginx/snippets/ecoflow-proxy.conf;
}
location ^~ /api/oferta {
    limit_req zone=ef_forms burst=5 nodelay;
    include /etc/nginx/snippets/ecoflow-proxy.conf;
}
location ^~ /api/kontakti {
    limit_req zone=ef_forms burst=5 nodelay;
    include /etc/nginx/snippets/ecoflow-proxy.conf;
}
# Снимките от Медия — без общия лимит: списък в админа тегли десетки наведнъж.
location ^~ /api/media/file/ {
    include /etc/nginx/snippets/ecoflow-proxy.conf;
}
location ^~ /api/ {
    limit_req zone=ef_api burst=100 nodelay;
    include /etc/nginx/snippets/ecoflow-proxy.conf;
}
# Страниците, /_next/image, /_next/static — без ограничение.
location / {
    include /etc/nginx/snippets/ecoflow-proxy.conf;
}
