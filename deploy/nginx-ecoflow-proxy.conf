# nginx — прокси към Next (порт 3000 само на 127.0.0.1).
# На сървъра: /etc/nginx/snippets/ecoflow-proxy.conf. Включва се в location.
proxy_pass http://127.0.0.1:3000;
proxy_http_version 1.1;
# $http_host (с порта), не $host: през тунела адресът е localhost:8080 и
# пренасочванията на Next трябва да запазят порта. На 443 двете са еднакви.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_connect_timeout 10s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;
