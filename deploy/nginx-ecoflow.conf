# nginx — сайтът на https://ecoflow.bg, зад Cloudflare (`task-domein-ecoflow-bg.md`,
# 16 октомври 2026; преди — https://91.212.13.155, `task-otvaryane-https-ip.md`).
# На сървъра: /etc/nginx/sites-available/ecoflow (symlink в sites-enabled).
# Заедно с: conf.d/ecoflow-limits.conf, snippets/ecoflow-app.conf,
# snippets/ecoflow-proxy.conf (същите имена в deploy/, без „nginx-") и
# conf.d/cloudflare-realip.conf (генерира го deploy/cloudflare-ips.sh).
#
# Cloudflare (DNS, прокси, режимът на SSL) се управлява САМО от хостинга.
# Сертификатът е Origin сертификатът на Cloudflare, сложен от хостинга —
# в този файл са само пътищата; файловете никога не влизат в git.
#
# Входове:
#   1. 443, ecoflow.bg        — сайтът;
#   2. 443, www.ecoflow.bg    — 301 към https://ecoflow.bg;
#   3. 443, всичко друго (IP, чужди имена) — TLS се отказва
#      (`ssl_reject_handshake`): за IP адреса няма валиден сертификат, а 301
#      след предупреждение в браузъра не помага;
#   4. 80, всичко             — 301 към https://ecoflow.bg (и http://IP);
#   5. 127.0.0.1:8081         — SSH тунелът (`scripts\otvori-sayta.bat`,
#      localhost:8080 → 8081), без https; не се вижда отвън.
# UFW пуска 80/443 само от диапазоните на Cloudflare — пряко по IP не се стига.
# HSTS — още не (решава собственикът при официалното пускане).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://ecoflow.bg$request_uri;
}

server {
    # nginx 1.24 (Ubuntu 24.04) — `http2` е в `listen`; `http2 on;` е от 1.25.1.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_reject_handshake on;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ecoflow.bg;

    ssl_certificate     /etc/ssl/certs/ecoflow.bg.cert;
    ssl_certificate_key /etc/ssl/private/ecoflow.bg.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:EFSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Robots-Tag "noindex, nofollow" always;
    return 301 https://ecoflow.bg$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ecoflow.bg;

    ssl_certificate     /etc/ssl/certs/ecoflow.bg.cert;
    ssl_certificate_key /etc/ssl/private/ecoflow.bg.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:EFSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Заглавията, блокираните пътища, limit_req, 429 и noindex — тук.
    include /etc/nginx/snippets/ecoflow-app.conf;
}

server {
    listen 127.0.0.1:8081;
    server_name localhost;

    include /etc/nginx/snippets/ecoflow-app.conf;
}
