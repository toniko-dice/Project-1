# nginx — reverse proxy пред Next (`task-kachvane-server.md`, т. 7).
# На сървъра: /etc/nginx/sites-available/ecoflow, symlink в sites-enabled.
# Порт 80 е ЗАТВОРЕН в UFW, докато домейнът ecoflow.bg не се насочи
# (тогава — Cloudflare, SSL, отваряне на 80/443: отделна задача).
# Собственикът стига до него през SSH тунел: localhost:8080 → 127.0.0.1:80.

server {
    listen 80;
    listen [::]:80;
    server_name ecoflow.bg www.ecoflow.bg _;

    server_tokens off;
    client_max_body_size 12m;

    # Снимките от Медия — направо от диска, с кеш. Адресът в Payload е
    # /api/media/file/<име>; ?v=<време> в адреса сменя кеша при подмяна.
    # Заключеният сайт (`/vhod`) НЕ важи за този път — затова той е
    # изключен, докато сайтът е заключен (виж README „Сървър").
    # location /api/media/file/ {
    #     alias /srv/ecoflow-bg/media/;
    #     expires 30d;
    #     add_header Cache-Control "public, max-age=2592000";
    #     try_files $uri =404;
    # }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
