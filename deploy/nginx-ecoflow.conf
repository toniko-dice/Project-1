# nginx — сайтът на https://91.212.13.155 (`task-otvaryane-https-ip.md`).
# На сървъра: /etc/nginx/sites-available/ecoflow (symlink в sites-enabled).
# Заедно с: conf.d/ecoflow-limits.conf, snippets/ecoflow-app.conf,
# snippets/ecoflow-proxy.conf (същите имена в deploy/, без „nginx-").
#
# Три входа:
#   1. порт 80  — само ACME проверката (Let's Encrypt) и 301 към https;
#   2. порт 443 — сайтът, сертификатът за IP адреса (6 дни, подновява се сам);
#   3. 127.0.0.1:8081 — за SSH тунела (`scripts\otvori-sayta.bat`,
#      localhost:8080 → 8081), без https: тунелът вече е криптиран, а през
#      порт 80 всичко би отишло на https://91.212.13.155. Не се вижда отвън.
#
# server_name е и за домейна — при ecoflow.bg: Cloudflare, нормален
# сертификат и HSTS (отделна задача).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 91.212.13.155 ecoflow.bg www.ecoflow.bg _;

    # Let's Encrypt (http-01, webroot) — certbot пише тук.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://91.212.13.155$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name 91.212.13.155 ecoflow.bg www.ecoflow.bg _;

    ssl_certificate     /etc/letsencrypt/live/ecoflow-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecoflow-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:EFSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/ecoflow-app.conf;
}

server {
    listen 127.0.0.1:8081;
    server_name localhost;

    include /etc/nginx/snippets/ecoflow-app.conf;
}
