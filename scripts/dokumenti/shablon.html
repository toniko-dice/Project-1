<!doctype html>
<!-- Шаблонът на преведените документи (scripts/dokumenti/prevod-pdf.mjs). Стилът — на сайта: Inter, #F2F2F2 за предупрежденията. -->
<html lang="bg">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { margin: 0; font: 10pt/1.5 Inter, "Segoe UI Symbol", "DejaVu Sans", Arial, sans-serif; color: #1a1a1a; }
  .head { border-bottom: 2px solid #1a1a1a; padding-bottom: 10px; margin-bottom: 14px; }
  .logo { height: 16px; display: block; margin-bottom: 14px; }
  .head h1 { font-size: 19pt; line-height: 1.2; font-weight: 700; margin: 0 0 6px; }
  .meta { color: #555; font-size: 9.5pt; margin: 2px 0; }
  .izvor { background: #F2F2F2; border-radius: 6px; padding: 9px 12px; margin: 0 0 18px; font-size: 9pt; line-height: 1.45; color: #333; }
  .izvor a { color: #333; word-break: break-all; }
  .toc { margin: 0 0 18px; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; break-inside: avoid; }
  .toc-title { font-weight: 700; margin-bottom: 4px; }
  .toc ul { margin: 0; padding-left: 0; list-style: none; columns: 2; column-gap: 24px; }
  code { font: inherit; font-weight: 600; }
  .toc li { font-size: 9pt; break-inside: avoid; }
  .toc a { color: #1a1a1a; text-decoration: none; }
  main h1 { font-size: 13.5pt; font-weight: 700; margin: 20px 0 8px; break-after: avoid; }
  main h2 { font-size: 11.5pt; font-weight: 600; margin: 16px 0 6px; break-after: avoid; }
  main h3 { font-size: 10.5pt; font-weight: 600; margin: 12px 0 4px; break-after: avoid; }
  p { margin: 0 0 7px; }
  ul, ol { margin: 0 0 8px; padding-left: 22px; }
  li { margin: 0 0 3px; }
  table { border-collapse: collapse; width: 100%; margin: 6px 0 12px; font-size: 9pt; }
  th, td { border: 1px solid #ccc; padding: 4px 7px; text-align: left; vertical-align: top; }
  th { background: #F2F2F2; font-weight: 600; }
  tr { break-inside: avoid; }
  .notice { background: #F2F2F2; border-left: 4px solid #888; border-radius: 4px; padding: 8px 12px 2px; margin: 8px 0 12px; break-inside: avoid; }
  .notice-label { font-weight: 700; letter-spacing: .04em; font-size: 9pt; margin-bottom: 3px; }
  .notice-danger { border-left-color: #c0161b; } .notice-danger .notice-label { color: #c0161b; }
  .notice-warning { border-left-color: #e06a00; } .notice-warning .notice-label { color: #b35500; }
  .notice-caution { border-left-color: #d9a400; } .notice-caution .notice-label { color: #8a6a00; }
  .notice-note, .notice-tip { border-left-color: #555; }
  .figura { margin: 10px 0 14px; break-inside: avoid; text-align: center; }
  .figura img { max-width: 100%; max-height: 165mm; object-fit: contain; } /* + подписът и легендата — на една страница */
  .figura figcaption { font-weight: 600; font-size: 9pt; margin-top: 4px; text-align: left; }
  .legenda { font-size: 9pt; text-align: left; }
  .legenda ul, .legenda ol { margin: 2px 0 0; }
  .legenda li { margin: 0 0 1px; }
  .krai { margin-top: 14px; padding-top: 8px; break-before: avoid; border-top: 1px solid #ccc; font-size: 9pt; color: #333; }
</style>
</head>
<body>
<header class="head">
  <img class="logo" src="{{logo}}" alt="EcoFlow">
  <h1>{{zaglavie}}</h1>
  <p class="meta">Продукт: {{produkti}}</p>
  <p class="meta">{{versiya}}</p>
</header>
<div class="izvor">Превод на ДИ СИ 2008 ООД от оригинала на EcoFlow ({{original}}). При разлики важи оригиналът.<br>Оригиналът: <a href="{{adres}}">{{adres}}</a></div>
{{sadarzhanie}}
<main>
{{tyalo}}
</main>
<!-- Имейлът — CONTACT_EMAIL (src/lib/contact.ts). Телефонът — само на /kontakti. -->
<p class="krai">За България: ДИ СИ 2008 ООД, официален дистрибутор на EcoFlow — office@ecoflow.bg, ecoflow.bg</p>
</body>
</html>
